<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🗝 두 번째 조각</title>
<style>
  body { background:#0a0e18; color:#cbb88a; font-family:'Galmuri11','Noto Sans KR',sans-serif; display:flex; justify-content:center; padding:40px 16px; }
  .card { max-width:560px; border:2px solid #7a5a2e; border-radius:10px; padding:28px; background:linear-gradient(180deg,#151e36,#0e1526); }
  h1 { color:#ffd98a; font-size:18px; margin:0 0 12px; }
  .cipher { font-family:monospace; letter-spacing:4px; color:#c08aff; font-size:16px; }
  .hint { margin-top:18px; color:#6f7d9c; font-size:12px; line-height:1.8; }
</style>
</head>
<body>
<div class="card">
  <h1>🗝 두 번째 조각</h1>
  <p>황혼의 기사가 남긴 암호문 (ROT13 — 열세 글자 밀기):</p>
  <p class="cipher">INYXLEVR</p>
  <p class="hint">· 풀면 8글자의 날개 달린 자 — v1.3.1에 새로 온 코스튬<br>
  · 게임 설정창 「비밀수첩」에 대문자로 입력하라<br>
  · 또 하나의 암호는 게임의 엔진 이름이다 (8글자 · 대문자)</p>
</div>
</body>
</html>
