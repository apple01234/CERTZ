<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>🗝 두 번째 조각</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 700px at 50% -10%, #2a1a4a 0%, #0a0e18 55%, #060910 100%);
    color: #cbb88a;
    font-family: 'Galmuri11', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 40px 16px 56px;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%; max-width: 560px;
    border: 2px solid #7a5a2e; border-radius: 12px;
    padding: 26px 24px;
    background: linear-gradient(180deg, #1a1536, #0e1526);
    box-shadow: 0 12px 48px rgba(0,0,0,.55), inset 0 0 60px rgba(122,90,46,.08);
  }
  h1 { color: #ffd98a; font-size: 18px; margin: 0 0 6px; letter-spacing: .5px; }
  .sub { color: #6f7d9c; font-size: 11px; margin: 0 0 16px; }
  .rule { height: 1px; background: linear-gradient(90deg, transparent, #7a5a2e88, transparent); margin: 14px 0; }
  .cipher {
    font-family: 'Sarasa Mono SC', ui-monospace, monospace;
    letter-spacing: 6px; color: #c08aff; font-size: 18px;
    text-align: center; padding: 12px 8px;
    border: 1px dashed #7a5a2e66; border-radius: 8px;
    background: rgba(0,0,0,.3);
    user-select: all;
  }
  .hint { margin-top: 14px; color: #8fa0c4; font-size: 12px; line-height: 1.9; }
  .hint b { color: #cbb88a; }
  .badge { display: inline-block; border: 1px solid #7a5a2e; border-radius: 999px; padding: 2px 10px; font-size: 10px; color: #ffd98a; background: rgba(122,90,46,.15); }
  .foot { margin-top: 18px; text-align: center; color: #4d5a77; font-size: 10px; letter-spacing: 2px; }
  .back { margin-top: 12px; font-size: 11px; }
  .back a { color: #7dc4ff; }
  @media (max-width: 420px) {
    body { padding: 22px 10px 40px; }
    .card { padding: 20px 16px; }
    .cipher { font-size: 16px; letter-spacing: 4px; }
  }
</style>
</head>
<body>
<div class="card">
  <span class="badge">ARG — 두 번째 조각</span>
  <h1 style="margin-top:10px">🗝 두 번째 조각</h1>
  <p class="sub">황혼의 기사가 남긴 암호문. 기사의 서약이 이 안에 있다.</p>
  <div class="rule"></div>
  <p>황혼의 기사가 남긴 암호문 (<b>ROT13</b> — 열세 글자 밀기):</p>
  <p class="cipher">INYXLEVR</p>
  <div class="rule"></div>
  <p class="hint">
    · 풀면 <b>8글자의 날개 달린 자</b> — v1.3.1에 새로 온 코스튬<br>
    · 게임 설정창 「<b>비밀수첩</b>」에 대문자로 입력하라<br>
    · 또 하나의 암호는 게임의 <b>엔진 이름</b>이다 (8글자 · 대문자)
  </p>
  <p class="back">← <a href="/secret/">첫 번째 조각으로</a></p>
  <p class="foot">— 세계수의 기록 조각 2 / 2 —</p>
</div>
</body>
</html>
