  <h1>📜 세계수의 기록 — 잊혀진 페이지</h1>
  <p>여행자여, 첫 암호는 아래 시의 각 행 첫 글자에 숨어 있다. (3글자의 천사 이름 — 이를 알파벳 6글자로 써서 대문자로 입력하라)</p>
  <p class="poem">
    어둠이 내려앉은 유적의 계단 위에서<br>
    류의 등불이 흔들리고,<br>
    이따금 별이 계단에 떨어진다.<br>
    영원히 닫힌 문 앞에서<br>
    잊혀진 이름을 불러보렴.
  </p>
  <p class="hint">· 두 번째 암호는 이 페이지 소스 어딘가에 (숫자 네 개)<br>
  · 세 번째 단서는 <a href="/secret/second.html">다음 페이지</a>에서<br>
  · 게임의 설정창 「비밀수첩」에 암호를 입력하면 보상이 주어진다</p>
