apply plugin: 'com.android.application'

android {
    namespace = "com.sertz.yggdrasil"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sertz.yggdrasil"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 90
        versionName "1.3.0" /* v1.3.0 — SNS 로그인 임시비활성·HUD ☰ 제거(설정으로 이동)·날개/망토 방향 렌더·오로라류 오라 전면강화(발판 룬+링+위스프)·소모품 수량사용+MAX·층식 구조 타일맵(단/절벽/계단)·VFX 3팩 통합(벚꽃/크리티컬/회복하트/레벨링/모닥불/분수)·NPC급 옷세트 3종+망토 2종·랭킹창+주간 랭커 보상(BM 유도) */ /* v1.2.1 — 치장 부착위치 앵커 수정(마왕날개 등)·펫 BM 전용·프리미엄 펫 라고스 상점 특전·최적화 3종(적 AI 3단 스로틀·부팅 분할 로드·저사양 게이터)·비약→책 이름 변경·메뉴 나가기(HUD ☰)·미소녀 얼굴+트윈테일 */ /* v1.2.0 — 포니테일 완전제거+환수·거래소 접속 근본수정(쿼리토큰+FC OPTIONS 204)·긴급귀환 3회/일·환생 대사·채팅 자동절단·애니눈 여캠·2차 8직업 외형·GM 외형·타격감 히트스톱·환생 워프 차단·비약 3종 */ /* v1.1.1 — 성별 치장 분리(남/여 실루엣 10종씩)·포니테일 방향별 재생성·무지개 오라 실제 무지개화·왕관 착용 수정·무릉도장 일반 유저 개방·결제 취소 상태 분류·거래소 로그인 개선 */ /* v1.1.0 — 캐릭터 외형 시스템(남녀 선택·피부 6종·완전 교체 코스튬 10종·장식 5종)·프롤로그·버그 20여 건 */ /* v1.0.19 — 로비 3단계 생성(이름→직업→외형)·유니온 공식/등급 개편·세로 플레이 허용·재림의 땅 15구역 */ /* v1.0.18 — 로비(캐릭터 선택·생성·슬롯 확장)·유니온 시스템(등급 11단계·그리드 DnD·상점·버프·아티팩트·레이드)·몬스터 파크(일일 입장권·웨이브·코인 상점)·환생 시작 캐릭터 복귀+5차 각성 리셋 수정·셰이더 강도 슬라이더+플리커 완화+보스전 밝기·모바일 하단바 */ /* v1.0.17 — 화살 방향 전 경로 3차 실측 검증(기본공격·절명 화살·절사명중·화살 폭우·신의 화살비·멀티 원격·어시스트 화살표 전부 정상 확정)·구버전 알림 게이트 신설(서버 /api/version 대조 — 구버전이면 타이틀에 재설치 안내 자동 표시)·apk-guide versionCode 표기 오류 정정 */ /* v1.0.16 — 공격/스킬 스프라이트 좌향 네이티브 통일(바라보는 방향=공격 방향 근본 수정)·환생 직업/전직/스토리 전면 초기화+요구 200렙·GM 이름표/황금오라·물약 정리+치장 6종·마법진 계열 분리·파티/동행 EXP 보너스 */ /* v1.0.15 — APK 로그인 안 됨(3차) 근본 수정: 크로스오리진 POST를 text/plain 단순 요청으로 강등해 프리플라이트 제거(stale sertz4 OPTIONS 404 우회)·로그인 유저 캐시 폴백 */ /* v1.0.14 — 멀티 투사체 좌우반전 근본 수정(네트워크 flip 물리 방향 정규화 — 원격 활·화살 항상 등 뒤로 나가던 버그)·적 원거리 투사체 진행 방향 정렬(역주행 렌더 수정) */ /* v1.0.13 — 벚꽃 연출 전면 제거(날씨·스킬·축하)·직업별 계열색 마법진 시그니처(2~3차 절제판/4~5차 풀)·계정 DB GitHub 자동 백업/복원·스크린샷 정리 */ /* v1.0.12 — 투사체 스킬 좌우반전 수정·기본서버 복원(sertz4)·4차 전직 시련 신설·긴급귀환 검은화면 수정·스콜&하티 쌍랑·근접 횃불·마을BGM 복구·Toon팩 2차 투입(눈보라/벚꽃/크리스플랫) */ /* v1.0.11 — Gameworks 유니티 팩 25종(마법진·참격·충격파·벚꽃) 투입 + N차 기존 스킬 전부 강화 + 신규 튜토리얼 6단계 (versionCode는 단조 유지)*/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('../sertz-release.keystore')
            storePassword 'sertz2020'
            keyAlias 'sertz'
            keyPassword 'sertz2020'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
