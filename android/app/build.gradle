종)·프롤로그·버그 20여 건 */ /* v1.0.19 — 로비 3단계 생성(이름→직업→외형)·유니온 공식/등급 개편·세로 플레이 허용·재림의 땅 15구역 */ /* v1.0.18 — 로비(캐릭터 선택·생성·슬롯 확장)·유니온 시스템(등급 11단계·그리드 DnD·상점·버프·아티팩트·레이드)·몬스터 파크(일일 입장권·웨이브·코인 상점)·환생 시작 캐릭터 복귀+5차 각성 리셋 수정·셰이더 강도 슬라이더+플리커 완화+보스전 밝기·모바일 하단바 */ /* v1.0.17 — 화살 방향 전 경로 3차 실측 검증(기본공격·절명 화살·절사명중·화살 폭우·신의 화살비·멀티 원격·어시스트 화살표 전부 정상 확정)·구버전 알림 게이트 신설(서버 /api/version 대조 — 구버전이면 타이틀에 재설치 안내 자동 표시)·apk-guide versionCode 표기 오류 정정 */ /* v1.0.16 — 공격/스킬 스프라이트 좌향 네이티브 통일(바라보는 방향=공격 방향 근본 수정)·환생 직업/전직/스토리 전면 초기화+요구 200렙·GM 이름표/황금오라·물약 정리+치장 6종·마법진 계열 분리·파티/동행 EXP 보너스 */ /* v1.0.15 — APK 로그인 안 됨(3차) 근본 수정: 크로스오리진 POST를 text/plain 단순 요청으로 강등해 프리플라이트 제거(stale sertz4 OPTIONS 404 우회)·로그인 유저 캐시 폴백 */ /* v1.0.14 — 멀티 투사체 좌우반전 근본 수정(네트워크 flip 물리 방향 정규화 — 원격 활·화살 항상 등 뒤로 나가던 버그)·적 원거리 투사체 진행 방향 정렬(역주행 렌더 수정) */ /* v1.0.13 — 벚꽃 연출 전면 제거(날씨·스킬·축하)·직업별 계열색 마법진 시그니처(2~3차 절제판/4~5차 풀)·계정 DB GitHub 자동 백업/복원·스크린샷 정리 */ /* v1.0.12 — 투사체 스킬 좌우반전 수정·기본서버 복원(sertz4)·4차 전직 시련 신설·긴급귀환 검은화면 수정·스콜&하티 쌍랑·근접 횃불·마을BGM 복구·Toon팩 2차 투입(눈보라/벚꽃/크리스플랫) */ /* v1.0.11 — Gameworks 유니티 팩 25종(마법진·참격·충격파·벚꽃) 투입 + N차 기존 스킬 전부 강화 + 신규 튜토리얼 6단계 (versionCode는 단조 유지)*/
        /* Play Console "it(이탈리아어) 번역 실패" 경고 근본 차단: 라이브러리(androidx·Firebase·AdMob 등)가
         *  유입하는 불필요 다국어 리소스를 ko/en만 남기고 제거 — 앱 자체 문자열은 values(기본)뿐이라 영향 0.
         *  게임 텍스트는 WebView(JS)라 무관. 유효 시점: 다음 빌드(vc127+) */
        resourceConfigurations += ["ko", "en"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* v1.0.16 보안 — 서명 정보를 소스에서 제거한다.
     *  종전엔 공개 저장소에 키스토어 파일과 비밀번호 평문이 함께 커밋돼 있었다(누구나 같은 키로
     *  서명한 APK를 만들어 기존 설치본을 업데이트할 수 있는 상태).
     *  우선순위: ① 환경변수(GitHub Actions Secrets / 로컬 셸) ② android/keystore.properties(gitignore)
     *  템플릿: android/keystore.properties.example
     *  값이 없으면 경고만 남기고 진행한다 — debug 빌드를 막지 않기 위해서다. release 서명에서 실패한다. */
    signingConfigs {
        release {
            def kp = new Properties()
            def kpFile = rootProject.file('keystore.properties')
            if (kpFile.exists()) kpFile.withInputStream { kp.load(it) }
            def envOr = { String envKey, String propKey -> System.getenv(envKey) ?: kp.getProperty(propKey) }
            def storePw = envOr('SERTZ_KEYSTORE_PASSWORD', 'storePassword')
            def keyPw = envOr('SERTZ_KEY_PASSWORD', 'keyPassword')
            if (!storePw || !keyPw) {
                logger.lifecycle('[SERTZ] 릴리스 서명 정보 없음 — SERTZ_KEYSTORE_PASSWORD·SERTZ_KEY_PASSWORD ' +
                    '환경변수 또는 android/keystore.properties 를 설정하세요 (android/keystore.properties.example 참고).')
            }
            storeFile file(envOr('SERTZ_KEYSTORE_PATH', 'storeFile') ?: '../sertz-release.keystore')
            storePassword storePw
            keyAlias envOr('SERTZ_KEY_ALIAS', 'keyAlias') ?: 'sertz'
            keyPassword keyPw
        }
    }
    buildTypes {
        release {
            /* v1.0.5-beta (vc127) — R8 ON: 축소·난독화·리소스 축소(Play DEX 최적화 인사이트 대응)
             *  Capacitor·플러그인 리플렉션 보호 규칙은 proguard-rules.pro 참조 */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        /* v1.0.2-beta — Firebase 실연동: google-services.json 투입 즉시 자동 활성화
         *  (Analytics — 플레이 지표 / Crashlytics — 크래시 리포트 / Auth — 구글 로그인)
         *  BoM 34.19.0으로 라이브러리 버전 일원 — 개별 버전 명기 금지 */
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
        firebaseCrashlytics {
            /* v1.0.5-beta (vc127) — R8 ON에 맞춰 매핑 업로드 활성화(난독화 스택트레이스 자동 복원) */
            mappingFileUploadEnabled = true
        }
        dependencies {
            implementation platform('com.google.firebase:firebase-bom:34.19.0')
            implementation 'com.google.firebase:firebase-analytics'
            implementation 'com.google.firebase:firebase-crashlytics'
            implementation 'com.google.firebase:firebase-auth'
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
