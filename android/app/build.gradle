/* v1.0.5-beta (vc133) — 보스 아트 유저 제공 시트 교체 1차: 니드호그·요르문간드(boss_jorm 독립)·펜리르·수르트 4종 168프레임 풀애니 */
/* v1.0.5-beta (vc132) — PC 웹 카메라 근본 수정: Phaser 4.2.1 렌더 변환(스크롤 center semantics) 재해석 — 줌>1에서 캐릭터 시야 이탈/절반 클리핑 근본 해소(수동 추적 전환) */
