apply plugin: 'com.android.application'

android {
    namespace = "com.sertz.myapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sertz.myapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 103
        versionName "1.4.11" /* v1.4.11 (vc103) — 유저 지시 6건: ①Google Drive 신규 에셋 팩 128MB 적극 통합(Hovl 마법이펙트 29·MatthewGuz 참격 17·Toon 5·벚꽃팩 2 + 잠자던 기존 에셋 활성화 pk_27·ep_·kd_ 소품·tx_ 스캐터·kd_plant 나무·item_emerald·cv_torch — 총 ~140종 투입) ②보스 9종 아트 전면 교체 2차(애니 셀셰이드 — 원작 정체성 유지·원본 규격 fit_pad로 판정 100% 불변) + 보스 패턴 신규 이펙트(소환 룬진·빔 테크링·낙뢰 섬광·지균 데칼·결정 파편·사망 폭발+연기·페이즈 플래시) ③자동전투 제자리 왕복 근본 수정 5종(사거리 진입 홀드 즉시 해제·정지거리 도입 75~78%·배회 BFS 연결성 검증·카이팅 방향 홀드 600ms·스택 감정 경화) ④신규 코스튬 2종(화염의 무희·신비술사 — cost_flame/cost_mystic 계열 112프레임 활성화) ⑤appId com.sertz.myapp 일원화(capacitor.config·MainActivity 패키지 이동·namespace·strings.xml) ⑥ARG 체계 완전 제거(유실된 v1.4.4 승인 작업 완수 — eggs.ts 435줄·비밀수첩·eggTick 삭제·구세이브 ARG 키 자동 청소) */ /* v1.4.10 (vc102) — 유저 지시 8건: 구매 수량 직접 입력(스테퍼 가운데 숫자 타이핑 1~99)·전투 UI 기본공격 밀착 재정렬([스킬]→[자동+물약]→[공격] flex order — v1.4.9 화면끝 정렬에 이어 공격 버튼 옆으로)·숲 필드 유적풍 소품(fm_tree/fm_prop 183~235px 이질 에셋) 전면 제거+cl_bones 제외·고목(ud_deadtree 128²) 줄기 충돌 부여(뚫고 다니던 문제)·히트박스 정밀 정렬(정예 hitW/hitH 스케일 누락 수정·플레이어 투사체 setCircle 고정 12px→프레임×스케일 기반)·튜토리얼 6단계 상세 설명 보강+컨텍스트 힌트(보스구역·사망·저HP·필드 진입 1회 안내)·챕터별 보스 BGM 전용 트랙표(BOSS_OF 9챕터 1:1 — boss6~9 피치 변형 파생곡 신규 추가·재림 r5/r10/r15 전용) */ /* v1.4.9 (vc101) — 보스 전면 리뉴얼: 9종 보스 아트 AI 리페인팅(심연의 수호자·니드호그·수르트·펜리르·스콜&하티·가름·아부디토스 전부 신규 일러스트 — 원본과 동일 텍스처 규격으로 판정 불변)·보스 애니메이션 전면 강화(하늘 낙하 등장+착지 충격파·±2.2% 호흡 펄스·공격별 예동 스쿼시&스트레치·피격 미세 진동·사망 시 오라색 잔상 3겹 확산+2중 충격파)·전투 UI 우측 정렬(스킬·물약·자동 버튼 화면 끝 — 유저 지시)·admin 계정 비밀번호 복구 경로 공식화(SERTZ_ADMIN_PASSWORD env 부팅 동기화 — 복원 경로 admin123 잔존 제거) */ /* v1.4.8 (vc100) — 전체 최적화(타깃 판정 프레임 캐시·트레일/충격링 풀링·PERF 스로틀)·보안 강화(전역 보안 헤더·CORS 화이트리스트·클라우드세이브 검증·소켓 GM 검증·관리자 시드 개선)·UI 재편(계정/파티/친구 중앙 모달 전환·트래커 축소·z-index 표준화)·기능별 사운드 분리(quest 38중복 해소)+BGM 크로스페이드·패널 등장 애니메이션 */
/* v1.4.7 — 오류나는 페이지 전면 철거(유저 지시): 마을 이상한 비석 제거·세계수의 기록(/secret) 페이지 삭제+지원센터 308 유도·비밀수첩 힌트 페이지 버튼 철거·ARG 힌트 외부 지원센터 웹페이지 이원화 */ /* v1.4.6 — 비밀/문의 페이지 404 근본 수정(/secret 후행슬래시 308→404 사슬 제거·서버 직접 서빙·문의 별칭 경로 /support 유도·비밀수첩 지원센터 버튼·APK 문의/계정삭제 API 원격 호출) */ /* v1.4.5 — 이상한 비석·ARG 페이지 유발 무한 재부팅 근본 차단(재부팅 예산 2회/2분+수동 복구 오버레이·네이티브 비석 window.open 금지→클립보드 안내·복귀 직후 15초 관찰 유예)·플레이스토어 대비(AD_ID 미사용 선언·applicationId com.sertz.myapp·지원센터/개인정보/계정삭제 페이지·HTTPS 강제)·멀티 진입 HUD 노출(더보기 멀티 버튼+파티/친구 위젯 좌측) */ /* v1.4.4 — 첫 사냥터 Lv3 교착 근본 수정(NPC 3명 대화→레벨3·초행자 훈련장 복구·보물상자 렌더 복구·v1.4.3 병합 유실분 복구) */ /* v1.4.3 — 유저 리포트 6건(유적 히트박스·철거/등급업 큐브 경로/보스 유물 아이콘/공동 토벌전/재림 시리즈) */ /* v1.4.2 — 요새 유적 타일맵 근본 수정(Phaser 4 setCrop이 크롭을 텍스처 원래 오프셋에 렌더 — 프레임 방식 전환으로 발코니·목책·계단 의도 위치 렌더)·스프라이트 미로딩 2차 방어(texGuard 무결성 감사·수복 — 재시도 한도 초과분·복귀 후 이미지 회수분 자동 재로드) */ /* v1.4.1 — 일부 스프라이트 미로딩(로드실패 자동 재시도 3회 — Android WebView 대량요청 실패분 복구)·요새 유적 타일맵 정상화(흙타일 아틀라스 가장자리 돌테두리 crop 교정·창·도끼였던 난간을 실제 목책으로·부유 흙타일 계단을 실제 나무계단 소품으로) */ /* v1.3.1 — SPUM 에셋 신규 코스튬 8종(발키리/마녀/숲수호자/백합/대군주/성기사/칼날/항해사 — 투구·후드·망토 실제 파트 조합)·검은화면 자가치유(로더 교착 폴백+장시간 백그라운드 재부팅)·게임 멈춤 수정(복귀 입력/물리 자가치유+히트스톱 재개 가드)·부활 가까운 마을 이동·모든 장비 스타포스(장신구 atk/def 트랙 신설)·전직 조각회수 폐지→맵이동 퀘스트(계열별 다른 맵)·지형물 배치 수정(유적/포탈/입구 보호)·능력치 소수 정리·모바일 절전 기본+적 상한 축소 */ /* v1.3.0 — SNS 로그인 임시 비활성화(재개 준비 완료)·선 3개(☰) UI 삭제·날개 항상 등 뒤 고정(방향 렌더 근본 수정+생성 depth)·NPC급 옷 세트 4종(드래곤/프로스트/사쿠라/보이드)·오로라류 체감 강화(림 2장+트윙클 4궤도)·소모품 사용 개수 지정+MAX 버튼·왕국 랭킹+랭커 전용 상점(BM 유도)·Drive 팩 대량 에셋 통합(VFX 58종+SFX 48종)·Cainos 타일셋 층식 구조맵(요새 유적 2층+상자/횃불 애니) */ /* v1.2.1 — 치장 부착위치 앵커 수정(마왕날개 등)·펫 BM 전용·프리미엄 펫 라고스 상점 특전·최적화 3종(적 AI 3단 스로틀·부팅 분할 로드·저사양 게이터)·비약→책 이름 변경·메뉴 나가기(HUD ☰)·미소녀 얼굴+트윈테일 */ /* v1.2.0 — 포니테일 완전제거+환수·거래소 접속 근본수정(쿼리토큰+FC OPTIONS 204)·긴급귀환 3회/일·환생 대사·채팅 자동절단·애니눈 여캠·2차 8직업 외형·GM 외형·타격감 히트스톱·환생 워프 차단·비약 3종 */ /* v1.1.1 — 성별 치장 분리(남/여 실루엣 10종씩)·포니테일 방향별 재생성·무지개 오라 실제 무지개화·왕관 착용 수정·무릉도장 일반 유저 개방·결제 취소 상태 분류·거래소 로그인 개선 */ /* v1.1.0 — 캐릭터 외형 시스템(남녀 선택·피부 6종·완전 교체 코스튬 10종·장식 5종)·프롤로그·버그 20여 건 */ /* v1.0.19 — 로비 3단계 생성(이름→직업→외형)·유니온 공식/등급 개편·세로 플레이 허용·재림의 땅 15구역 */ /* v1.0.18 — 로비(캐릭터 선택·생성·슬롯 확장)·유니온 시스템(등급 11단계·그리드 DnD·상점·버프·아티팩트·레이드)·몬스터 파크(일일 입장권·웨이브·코인 상점)·환생 시작 캐릭터 복귀+5차 각성 리셋 수정·셰이더 강도 슬라이더+플리커 완화+보스전 밝기·모바일 하단바 */ /* v1.0.17 — 화살 방향 전 경로 3차 실측 검증(기본공격·절명 화살·절사명중·화살 폭우·신의 화살비·멀티 원격·어시스트 화살표 전부 정상 확정)·구버전 알림 게이트 신설(서버 /api/version 대조 — 구버전이면 타이틀에 재설치 안내 자동 표시)·apk-guide versionCode 표기 오류 정정 */ /* v1.0.16 — 공격/스킬 스프라이트 좌향 네이티브 통일(바라보는 방향=공격 방향 근본 수정)·환생 직업/전직/스토리 전면 초기화+요구 200렙·GM 이름표/황금오라·물약 정리+치장 6종·마법진 계열 분리·파티/동행 EXP 보너스 */ /* v1.0.15 — APK 로그인 안 됨(3차) 근본 수정: 크로스오리진 POST를 text/plain 단순 요청으로 강등해 프리플라이트 제거(stale sertz4 OPTIONS 404 우회)·로그인 유저 캐시 폴백 */ /* v1.0.14 — 멀티 투사체 좌우반전 근본 수정(네트워크 flip 물리 방향 정규화 — 원격 활·화살 항상 등 뒤로 나가던 버그)·적 원거리 투사체 진행 방향 정렬(역주행 렌더 수정) */ /* v1.0.13 — 벚꽃 연출 전면 제거(날씨·스킬·축하)·직업별 계열색 마법진 시그니처(2~3차 절제판/4~5차 풀)·계정 DB GitHub 자동 백업/복원·스크린샷 정리 */ /* v1.0.12 — 투사체 스킬 좌우반전 수정·기본서버 복원(sertz4)·4차 전직 시련 신설·긴급귀환 검은화면 수정·스콜&하티 쌍랑·근접 횃불·마을BGM 복구·Toon팩 2차 투입(눈보라/벚꽃/크리스플랫) */ /* v1.0.11 — Gameworks 유니티 팩 25종(마법진·참격·충격파·벚꽃) 투입 + N차 기존 스킬 전부 강화 + 신규 튜토리얼 6단계 (versionCode는 단조 유지)*/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('../sertz-release.keystore')
            storePassword 'sertz2020'
            keyAlias 'sertz'
            keyPassword 'sertz2020'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
